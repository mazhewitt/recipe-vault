<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Vault - Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css?v={{asset_version}}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <!-- User Identity & Logout -->
    <div class="user-info">
        <span class="user-email">{{user_email}}</span>
        <a href="/cdn-cgi/access/logout" class="logout-link">Logout</a>
    </div>

    <div class="app-container">
        <!-- Recipe Book Section (the only column) -->
        <div class="book-container">
            <div class="section-label clickable" id="recipe-book-header">Recipe Book</div>
            <div class="recipe-book">
                <div class="book-cover"></div>

                <!-- Timer pill, clipped to the top-right of the cover -->
                <div class="timer-widget" id="timer-widget" style="display: none;">
                    <div class="timer-icon">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="13" r="9"/>
                            <polyline points="12 7 12 13 15 15"/>
                            <path d="M9 2h6"/>
                            <path d="M12 2v2"/>
                        </svg>
                    </div>
                    <span class="timer-text" id="timer-text">Timer: 00:00</span>
                    <button class="timer-cancel" onclick="cancelTimer()" type="button" title="Cancel timer" aria-label="Cancel timer">✕</button>
                </div>

                <button id="page-prev" class="page-nav prev" aria-label="Previous recipe" disabled>&lt;</button>
                <button id="page-next" class="page-nav next" aria-label="Next recipe" disabled>&gt;</button>

                <!-- Mobile Edge Navigation -->
                <div class="mobile-edge-nav mobile-edge-prev" id="mobile-edge-prev" aria-label="Previous recipe">
                    <svg viewBox="0 0 24 24" class="edge-chevron">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </div>
                <div class="mobile-edge-nav mobile-edge-next" id="mobile-edge-next" aria-label="Next recipe">
                    <svg viewBox="0 0 24 24" class="edge-chevron">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>

                <!-- Desktop / tablet edge ribbons (inert furniture), on the right outer edge of the book.
                     Sibling of .pages-container so they neither scroll with the page
                     nor take part in the #page-right grid. -->
                <div class="edge-tabs" role="tablist" aria-label="Recipe sections">
                    <button type="button" class="edge-tab" role="tab" aria-hidden="true" tabindex="-1" data-tab="ingredients" aria-selected="true" aria-controls="page-right-content">Ingredients</button>
                    <button type="button" class="edge-tab" role="tab" aria-hidden="true" tabindex="-1" data-tab="method" aria-selected="false" aria-controls="page-right-content">Method</button>
                </div>

                <div class="pages-container">
                    <!-- Left Page — contents -->
                    <div class="page page-left" id="page-left">
                        <!-- The left page's own tab strip, on its outer edge.
                             A sibling of #page-left-content, so the contents
                             re-render never destroys it. It holds two button
                             sets and shows exactly one: the contents filters
                             while no recipe is open, the spread modes while one
                             is. spread-modes.js swaps them with `hidden`. -->
                        <nav class="contents-tabs" aria-label="Contents filter">
                            <button type="button" class="contents-tab contents-tab-all is-active" data-filter="all" aria-pressed="true">All</button>
                            <button type="button" class="contents-tab contents-tab-mains" data-filter="main" aria-pressed="false">Mains</button>
                            <button type="button" class="contents-tab contents-tab-sweets" data-filter="dessert" aria-pressed="false">Sweets</button>
                            <button type="button" class="contents-tab contents-tab-meals" data-filter="meals" aria-pressed="false" hidden>Meals</button>
                            <!-- Spread modes. Deliberately no role="tab" and no
                                 data-tab: page-tabs.js delegates on
                                 [role="tab"][data-tab] and must never see these,
                                 which control the left page, not the right. -->
                            <button type="button" class="contents-tab spread-tab" data-mode="contents" aria-pressed="false" hidden>Contents</button>
                            <button type="button" class="contents-tab spread-tab" data-mode="cook" aria-pressed="false" hidden>Cook</button>
                            <button type="button" class="contents-tab spread-tab" data-mode="notes" aria-pressed="false" hidden>Notes</button>
                        </nav>
                        <div class="page-content" id="page-left-content">
                            <div class="recipe-placeholder">
                                <div class="recipe-placeholder-icon">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M4 19h16a2 2 0 002-2V7a2 2 0 00-2-2H4a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                                        <path d="M12 11v4"/>
                                        <path d="M9 14h6"/>
                                    </svg>
                                </div>
                                <div class="recipe-placeholder-text">
                                    Ask me to find or create a recipe, and it will appear here in your book.
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Right Page — the recipe (or the meal plan, or the second
                         half of the contents in index mode) -->
                    <div class="page page-right" id="page-right" data-tab="ingredients">
                        <!-- Phone paper tabs, on the page's top edge -->
                        <div class="page-tabs" role="tablist" aria-label="Recipe sections">
                            <button type="button" class="page-tab active" role="tab" data-tab="ingredients" aria-selected="true" aria-controls="page-right-content">Ingredients</button>
                            <button type="button" class="page-tab" role="tab" data-tab="method" aria-selected="false" aria-controls="page-right-content">Method</button>
                            <button type="button" class="page-tab" role="tab" data-tab="notes" aria-selected="false" aria-controls="page-right-content">Notes</button>
                        </div>
                        <div class="page-content" id="page-right-content"></div>
                    </div>
                </div>
            </div>

            <!-- The reply sticky: the latest reply (or the in-flight line) of the
                 thread on display, overlaid directly above the note input - at the
                 foot of the left page above 600px, above the input bar on a phone.
                 margin-notes.js renders into it and places it. -->
            <aside id="page-margin" class="page-margin" aria-live="polite"></aside>

            <!-- The single chat surface. Desktop/tablet: absolutely positioned over
                 the foot of the right page. Phone: a cream bar beneath the book. -->
            <form class="note-input" id="note-input" autocomplete="off">
                <div id="image-attachment" class="image-attachment" hidden>
                    <span class="image-icon">🖼️</span>
                    <span class="image-text">Image attached</span>
                    <button class="remove-image" onclick="removeImage()" type="button" aria-label="Remove attached image">✕</button>
                </div>
                <div class="note-input-row">
                    <span class="note-pencil" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="1.6" fill="none">
                            <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
                            <path d="M2 2l7.586 7.586"/>
                        </svg>
                    </span>
                    <textarea id="message-input" class="note-textarea" rows="1"
                              placeholder="Write a note to the cook…"
                              aria-label="Write a note to the cook"></textarea>
                    <input type="file" id="image-upload" accept="image/*" hidden>
                    <button class="clipboard-button" id="clipboard-button" type="button" title="Attach image from clipboard or upload" aria-label="Attach image from clipboard or upload">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                        </svg>
                    </button>
                    <button class="note-send" id="send-button" type="submit" aria-label="Send note">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                    <span class="note-page-number" id="note-page-number">p. 1</span>
                </div>
            </form>
        </div>
    </div>

    <!-- Photo Preview Overlay -->
    <div id="photo-preview-overlay" class="photo-preview-overlay">
        <img id="photo-preview-img" src="" alt="Photo preview">
    </div>

    <script type="module" src="/static/app.js?v={{asset_version}}"></script>
</body>
</html>
